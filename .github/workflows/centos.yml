name: centos
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  centos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["centos:centos7"]
        rails_env: [staging, production]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v2
      - name: Update system packages
        run: yum check-update || true
      - name: Install needed packages
        run: yum install -y lsb-release sudo python3-pip openssh-server
      - name: Update pip
        run: pip3 install --upgrade pip
      - name: Install Ansible
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pip3 install ansible
      - name: Create hosts file
        run: echo "localhost ansible_connection=local ansible_user=root" > hosts
      - name: Generate dummy SSH key
        run: mkdir ~/.ssh && ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
      - name: Run CONSUL installer
        run: ansible-playbook consul.yml -i hosts --extra-vars "env=${{ matrix.rails_env }} domain=localhost errbit=True"
